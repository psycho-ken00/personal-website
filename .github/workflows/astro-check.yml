name: Check Astro site

on:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'new-site/**'
      - '.github/workflows/astro-check.yml'
  pull_request:
    paths:
      - 'new-site/**'
      - '.github/workflows/astro-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm check
      - name: Build static site
        run: pnpm build
